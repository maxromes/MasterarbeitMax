[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mikrozooplankton-gran-canaria-2026"
version = "0.1.0"
description = "Analyseprojekt fuer das Mikrozooplankton-Experiment auf Gran Canaria 2026"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0",
  "openpyxl>=3.1",
  "scipy>=1.11",
  "statsmodels>=0.14",
  "matplotlib>=3.8",
  "seaborn>=0.13",
]

[tool.setuptools.packages.find]
where = ["src"]
